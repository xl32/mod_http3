name: interop

on:
  workflow_call:
    inputs:
      linux-image:
        description: Linux image the build stage published, reused for the endpoint.
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}-interop:${{ github.sha }}
  RUNNER: quic-interop/quic-interop-runner

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.clients.outputs.list }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialise submodules
        run: |
          git submodule update --init
          git submodule update --init --recursive dependencies/nghttp3
          git submodule update --init dependencies/ngtcp2

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build endpoint
        uses: docker/build-push-action@v7
        with:
          context: .
          file: interop/Containerfile
          build-args: MODULE_IMAGE=${{ inputs.linux-image }}
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=interop
          cache-to: type=gha,scope=interop,mode=max

      - name: Check exit 127
        run: |
          rc=0
          timeout 120 docker run --rm -e ROLE=server -e TESTCASE=bogus "$IMAGE" || rc=$?
          test "$rc" -eq 127

      - name: Publish endpoint
        uses: docker/build-push-action@v7
        with:
          context: .
          file: interop/Containerfile
          build-args: MODULE_IMAGE=${{ inputs.linux-image }}
          tags: ${{ env.IMAGE }}
          push: true
          cache-from: type=gha,scope=interop

      - name: List clients
        id: clients
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          list=$(gh api "repos/$RUNNER/contents/implementations_quic.json" \
                 -H "Accept: application/vnd.github.raw" |
                 jq -c '[to_entries[] | select(.value.role != "server") | .key]')
          echo "list=$list" | tee -a "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.client }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        client: ${{ fromJson(needs.build.outputs.clients) }}
    env:
      CLIENT: ${{ matrix.client }}

    steps:
      - name: Checkout runner
        uses: actions/checkout@v7
        with:
          repository: ${{ env.RUNNER }}

      - name: Set up docker
        uses: docker/setup-docker-action@v5
        with:
          version: version=v28.3.0

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runner
        run: pip install -r requirements.txt

      - name: Install tshark
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/nightly
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
          sudo modprobe ip6table_filter

      - name: Pull images
        run: |
          docker pull "$IMAGE"
          python pull.py -i "$CLIENT"
          # A client whose image upstream removed is not our failure: skip it.
          client_image=$(jq -r --arg c "$CLIENT" '.[$c].image' implementations_quic.json)
          if ! docker image inspect "$client_image" >/dev/null 2>&1; then
            echo "::warning title=$CLIENT::no client image $client_image, skipped"
            echo "### $CLIENT — skipped, no image" >>"$GITHUB_STEP_SUMMARY"
            echo "NO_IMAGE=1" >>"$GITHUB_ENV"
          fi

      - name: Register endpoint
        if: env.NO_IMAGE != '1'
        run: |
          jq --arg image "$IMAGE" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
             '. + {mod_http3: {image: $image, role: "server", url: $url}}' \
             implementations_quic.json >impls.json
          mv impls.json implementations_quic.json

      - name: Run matrix
        if: env.NO_IMAGE != '1'
        # The runner's tshark can crash on a cut capture: allow 2 failed tries.
        run: |
          for try in 1 2 3; do
            rm -f results.json
            python run.py -s mod_http3 -c "$CLIENT" -t http3 -l logs/$try -j results.json || true
            result=$(jq -r '.results[0][0].result' results.json 2>/dev/null || true)
            case $result in succeeded|unsupported) break ;; esac
            echo "::warning title=$CLIENT::try $try: ${result:-no result}"
          done

      - name: Report verdict
        if: env.NO_IMAGE != '1'
        run: |
          result=$(jq -r '.results[0][0].result' results.json 2>/dev/null || echo 'no result')
          echo "### $CLIENT — \`$result\`" >>"$GITHUB_STEP_SUMMARY"
          case $result in
            succeeded)   ;;
            unsupported) echo "::warning title=$CLIENT::the client has no http3 test case" ;;
            *)           echo "::error title=$CLIENT::http3 $result"; exit 1 ;;
          esac

      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-logs-${{ matrix.client }}
          path: logs/
          retention-days: 14
